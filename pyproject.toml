[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-etl"
version = "0.1.0"
description = "Ingest Hyperliquid ecosystem data into ClickHouse"
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.34",
  "clickhouse-driver>=0.2.7",
  "lz4>=4.3",
  "pyarrow>=15",
  "typer>=0.12",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
hyperliquid-etl = "hyperliquid_etl.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

