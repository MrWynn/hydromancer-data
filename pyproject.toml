[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromancer-snapshot"
version = "0.1.0"
description = "Inspect, download, and synchronize Hydromancer Reservoir snapshots"
requires-python = ">=3.9"
dependencies = [
  "boto3>=1.34",
  "clickhouse-driver>=0.2.7",
  "pyarrow>=15",
  "typer>=0.12",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
hydro-snapshot = "hydro_snapshot.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

